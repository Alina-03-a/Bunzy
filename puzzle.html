<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Puzzle | Bunzy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f9e1e8;
      color: #59653d;
      text-align: center;
      overflow-x: hidden;
    }

    .puzzle-page {
      min-height: 100vh;
      padding: 35px 20px 50px;
    }

    h1 {
      margin: 0;
      font-family: "Voluptuous Bubble", Arial, sans-serif;
      font-size: clamp(3.5rem, 10vw, 6rem);
      color: #ef9db5;
      -webkit-text-stroke: 2px #c96f91;
      text-shadow:
        3px 3px 0 #fff7f8,
        6px 6px 0 #aebf86;
      letter-spacing: 3px;
    }

    .subtitle {
      margin: 15px 0 30px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .puzzle-gallery {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .puzzle-choice {
      border: none;
      padding: 0;
      background: #fff7f8;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 6px 6px 0 #aebf86;
      transition: transform 0.2s;
    }

    .puzzle-choice:hover {
      transform: scale(1.03);
    }

    .puzzle-choice img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .puzzle-name {
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #c96f91;
    }

    .hidden {
      display: none;
    }

    /* SCHERMATA DIFFICOLTÀ */

    .difficulty-screen {
      max-width: 900px;
      margin: 0 auto;
    }

    .selected-preview {
      width: 100%;
      max-width: 650px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 25px;
      box-shadow: 7px 7px 0 #aebf86;
      margin: 10px auto 30px;
      display: block;
    }

    .difficulty-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .difficulty-button {
      width: 210px;
      border: none;
      border-radius: 25px;
      padding: 25px 15px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      transition: transform 0.2s;
    }

    .difficulty-button:hover {
      transform: scale(1.05);
    }

    .easy {
      background: #cfe8c7;
      color: #5f8757;
      box-shadow: 6px 6px 0 #8caf82;
    }

    .medium {
      background: #ffe7a8;
      color: #b58b32;
      box-shadow: 6px 6px 0 #d4b55e;
    }

    .hard {
      background: #ffc9cf;
      color: #b85f6d;
      box-shadow: 6px 6px 0 #d98794;
    }

    .difficulty-pieces {
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .back-button {
      margin-top: 40px;
      padding: 13px 24px;
      border: none;
      border-radius: 20px;
      background: #aebf86;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    /* GIOCO PUZZLE */

.puzzle-game {
  max-width: 700px;
  margin: 0 auto;
}

.puzzle-board {
  width: 100%;
  max-width: 600px;
  margin: 25px auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: white;
  padding: 4px;
  border-radius: 18px;
  overflow: hidden;
}

.puzzle-piece {
  aspect-ratio: 1 / 1;
  background-size: 300% 300%;
  background-repeat: no-repeat;
  cursor: pointer;
  transition: transform 0.15s;
}

.puzzle-piece.selected {
  transform: scale(0.95);
  box-shadow: inset 0 0 0 4px #ef9db5;
}

.puzzle-message {
  font-size: 1.4rem;
  font-weight: bold;
  color: #c96f91;
  margin-top: 20px;
}

    @media (max-width: 600px) {
      .puzzle-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="puzzle-page">

    <h1>PUZZLE</h1>

    <!-- SCELTA IMMAGINE -->

    <div id="imageScreen">

      <p class="subtitle">
        Scegli l'immagine che vuoi ricomporre 🧩
      </p>

      <div class="puzzle-gallery">

        <button class="puzzle-choice" onclick="selectImage('autumn.jpeg')">
          <img src="autumn.jpeg" alt="Autumn">
          <div class="puzzle-name">🍂 Autumn</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('sea.jpeg')">
          <img src="sea.jpeg" alt="Sea">
          <div class="puzzle-name">🌊 Sea</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('island.jpeg')">
          <img src="island.jpeg" alt="Island">
          <div class="puzzle-name">🏝️ Island</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('icecream.jpeg')">
          <img src="icecream.jpeg" alt="Ice Cream">
          <div class="puzzle-name">🍦 Ice Cream</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('japan.jpeg')">
          <img src="japan.jpeg" alt="Japan">
          <div class="puzzle-name">🌸 Japan</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('winter.jpeg')">
          <img src="winter.jpeg" alt="Winter">
          <div class="puzzle-name">❄️ Winter</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('fantasypaint.jpeg')">
          <img src="fantasypaint.jpeg" alt="Fantasy">
          <div class="puzzle-name">🎨 Fantasy</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('castle.jpeg')">
          <img src="castle.jpeg" alt="Castle">
          <div class="puzzle-name">🏰 Castle</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('sunset.jpeg')">
          <img src="sunset.jpeg" alt="Sunset">
          <div class="puzzle-name">🌅 Sunset</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('underwater.png')">
          <img src="underwater.png" alt="Underwater">
          <div class="puzzle-name">🐠 Underwater</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('cloudycastle.png')">
          <img src="cloudycastle.png" alt="Cloudy Castle">
          <div class="puzzle-name">☁️ Cloudy Castle</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('beachparadise.png')">
          <img src="beachparadise.png" alt="Beach Paradise">
          <div class="puzzle-name">🏖️ Beach Paradise</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('nightroom.png')">
          <img src="nightroom.png" alt="Night Room">
          <div class="puzzle-name">🌙 Night Room</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('magicgarden.jpeg')">
          <img src="magicgarden.jpeg" alt="Magic Garden">
          <div class="puzzle-name">✨ Magic Garden</div>
        </button>

      </div>

    </div>

    <!-- SCELTA DIFFICOLTÀ -->

    <div id="difficultyScreen" class="difficulty-screen hidden">

      <p class="subtitle">
        Scegli la difficoltà 🧩
      </p>

      <img
        id="selectedImage"
        class="selected-preview"
        src=""
        alt="Immagine scelta"
      >

      <div class="difficulty-buttons">

        <button class="difficulty-button easy" onclick="startPuzzle('easy')">
          🟢 Easy
          <span class="difficulty-pieces">9 pezzi · 3 × 3</span>
        </button>

        <button class="difficulty-button medium" onclick="startPuzzle('medium')">
          🟡 Medium
          <span class="difficulty-pieces">16 pezzi · 4 × 4</span>
        </button>

        <button class="difficulty-button hard" onclick="startPuzzle('hard')">
          🔴 Hard
          <span class="difficulty-pieces">36 pezzi · 6 × 6</span>
        </button>

      </div>

      <button class="back-button" onclick="backToImages()">
        ← Cambia immagine
      </button>
    </div>

    <!-- GIOCO PUZZLE -->

    <div id="puzzleGame" class="puzzle-game hidden">

      <p class="subtitle">
        Ricomponi l'immagine! 🧩
      </p>

      <div id="puzzleBoard" class="puzzle-board"></div>

      <div id="puzzleMessage" class="puzzle-message"></div>

      <button class="back-button" onclick="backToDifficulty()">
        ← Cambia difficoltà
      </button>

    </div>

    <button class="back-button" onclick="window.location.href='index.html'">
      ← Torna a Bunzy
    </button>
    
    </div>

    <button class="back-button" onclick="window.location.href='index.html'">
      ← Torna a Bunzy
    </button>

  </main>

  <script>
    let selectedImage = "";

    function selectImage(image) {
      selectedImage = image;

      document.getElementById("selectedImage").src = image;

      document.getElementById("imageScreen").classList.add("hidden");
      document.getElementById("difficultyScreen").classList.remove("hidden");
    }

    function backToImages() {
      document.getElementById("difficultyScreen").classList.add("hidden");
      document.getElementById("imageScreen").classList.remove("hidden");
    }

    let selectedPiece = null;

function startPuzzle(difficulty) {
  if (difficulty !== "easy") {
    alert("Per ora facciamo prima Easy! 🧩");
    return;
  }

  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("puzzleGame").classList.remove("hidden");

  createPuzzle();
}

function createPuzzle() {
  const board = document.getElementById("puzzleBoard");

  board.innerHTML = "";
  selectedPiece = null;

  const pieces = [];

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      pieces.push({
        row: row,
        col: col
      });
    }
  }

  pieces.sort(() => Math.random() - 0.5);

  pieces.forEach((piece) => {
    const div = document.createElement("div");

    div.classList.add("puzzle-piece");

    div.style.backgroundImage = `url("${selectedImage}")`;
    div.style.backgroundPosition =
      `${piece.col * 50}% ${piece.row * 50}%`;

    div.addEventListener("click", selectPiece);

    board.appendChild(div);
  });
}

function selectPiece(event) {
  const piece = event.currentTarget;

  if (!selectedPiece) {
    selectedPiece = piece;
    piece.classList.add("selected");
    return;
  }

  if (selectedPiece === piece) {
    piece.classList.remove("selected");
    selectedPiece = null;
    return;
  }

  const firstPosition = selectedPiece.style.backgroundPosition;
  const secondPosition = piece.style.backgroundPosition;

  selectedPiece.style.backgroundPosition = secondPosition;
  piece.style.backgroundPosition = firstPosition;

  selectedPiece.classList.remove("selected");
  selectedPiece = null;

  checkPuzzle();
}

function checkPuzzle() {
  const pieces = document.querySelectorAll(".puzzle-piece");

  let complete = true;

  pieces.forEach((piece, index) => {
    const row = Math.floor(index / 3);
    const col = index % 3;

    const correctPosition =
      `${col * 50}% ${row * 50}%`;

    if (piece.style.backgroundPosition !== correctPosition) {
      complete = false;
    }
  });

  if (complete) {
    document.getElementById("puzzleMessage").textContent =
      "Hai completato il puzzle! 🎉💗";
  }
}

function backToDifficulty() {
  document.getElementById("puzzleGame").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.remove("hidden");

  document.getElementById("puzzleMessage").textContent = "";
  selectedPiece = null;
}
  </script>

</body>
</html>
