<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Puzzle | Bunzy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f9e1e8;
      color: #59653d;
      text-align: center;
      overflow-x: hidden;
    }

    .puzzle-page {
      min-height: 100vh;
      padding: 35px 20px 50px;
    }

    h1 {
      margin: 0;
      font-family: "Voluptuous Bubble", Arial, sans-serif;
      font-size: clamp(3.5rem, 10vw, 6rem);
      color: #ef9db5;
      -webkit-text-stroke: 2px #c96f91;
      text-shadow:
        3px 3px 0 #fff7f8,
        6px 6px 0 #aebf86;
      letter-spacing: 3px;
    }

    .subtitle {
      margin: 15px 0 30px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .puzzle-gallery {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .puzzle-choice {
      border: none;
      padding: 0;
      background: #fff7f8;
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 6px 6px 0 #aebf86;
      transition: transform 0.2s;
    }

    .puzzle-choice:hover {
      transform: scale(1.03);
    }

    .puzzle-choice img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .puzzle-name {
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #c96f91;
    }

    .hidden {
      display: none;
    }

    /* SCHERMATA DIFFICOLTÀ */

    .difficulty-screen {
      max-width: 900px;
      margin: 0 auto;
    }

    .selected-preview {
      width: 100%;
      max-width: 650px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 25px;
      box-shadow: 7px 7px 0 #aebf86;
      margin: 10px auto 30px;
      display: block;
    }

    .difficulty-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .difficulty-button {
      width: 210px;
      border: none;
      border-radius: 25px;
      padding: 25px 15px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      transition: transform 0.2s;
    }

    .difficulty-button:hover {
      transform: scale(1.05);
    }

    .easy {
      background: #cfe8c7;
      color: #5f8757;
      box-shadow: 6px 6px 0 #8caf82;
    }

    .medium {
      background: #ffe7a8;
      color: #b58b32;
      box-shadow: 6px 6px 0 #d4b55e;
    }

    .hard {
      background: #ffc9cf;
      color: #b85f6d;
      box-shadow: 6px 6px 0 #d98794;
    }

    .difficulty-pieces {
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .back-button {
      margin-top: 40px;
      padding: 13px 24px;
      border: none;
      border-radius: 20px;
      background: #aebf86;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
/* GIOCO PUZZLE */

.puzzle-game {
  max-width: 900px;
  margin: 0 auto;
}

.puzzle-board {
  width: 100%;
  max-width: 760px;
  aspect-ratio: 16 / 9;
  margin: 25px auto;
  position: relative;
  border: 4px dashed #aebf86;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.45);
  overflow: hidden;
  touch-action: none;
}

.puzzle-piece {
  position: absolute;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.puzzle-piece:active {
  cursor: grabbing;
  filter: drop-shadow(4px 6px 5px rgba(0, 0, 0, 0.25));
}

.puzzle-message {
  font-size: 1.4rem;
  font-weight: bold;
  color: #c96f91;
  margin-top: 20px;
}

    @media (max-width: 600px) {
      .puzzle-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="puzzle-page">

    <h1>PUZZLE</h1>

    <!-- SCELTA IMMAGINE -->

    <div id="imageScreen">

      <p class="subtitle">
        Scegli l'immagine che vuoi ricomporre 🧩
      </p>

      <div class="puzzle-gallery">

        <button class="puzzle-choice" onclick="selectImage('autumn.jpeg')">
          <img src="autumn.jpeg" alt="Autumn">
          <div class="puzzle-name">🍂 Autumn</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('sea.jpeg')">
          <img src="sea.jpeg" alt="Sea">
          <div class="puzzle-name">🌊 Sea</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('island.jpeg')">
          <img src="island.jpeg" alt="Island">
          <div class="puzzle-name">🏝️ Island</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('icecream.jpeg')">
          <img src="icecream.jpeg" alt="Ice Cream">
          <div class="puzzle-name">🍦 Ice Cream</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('japan.jpeg')">
          <img src="japan.jpeg" alt="Japan">
          <div class="puzzle-name">🌸 Japan</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('winter.jpeg')">
          <img src="winter.jpeg" alt="Winter">
          <div class="puzzle-name">❄️ Winter</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('fantasypaint.jpeg')">
          <img src="fantasypaint.jpeg" alt="Fantasy">
          <div class="puzzle-name">🎨 Fantasy</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('castle.jpeg')">
          <img src="castle.jpeg" alt="Castle">
          <div class="puzzle-name">🏰 Castle</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('sunset.jpeg')">
          <img src="sunset.jpeg" alt="Sunset">
          <div class="puzzle-name">🌅 Sunset</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('underwater.png')">
          <img src="underwater.png" alt="Underwater">
          <div class="puzzle-name">🐠 Underwater</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('cloudycastle.png')">
          <img src="cloudycastle.png" alt="Cloudy Castle">
          <div class="puzzle-name">☁️ Cloudy Castle</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('beachparadise.png')">
          <img src="beachparadise.png" alt="Beach Paradise">
          <div class="puzzle-name">🏖️ Beach Paradise</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('nightroom.png')">
          <img src="nightroom.png" alt="Night Room">
          <div class="puzzle-name">🌙 Night Room</div>
        </button>

        <button class="puzzle-choice" onclick="selectImage('magicgarden.jpeg')">
          <img src="magicgarden.jpeg" alt="Magic Garden">
          <div class="puzzle-name">✨ Magic Garden</div>
        </button>

      </div>

    </div>

    <!-- SCELTA DIFFICOLTÀ -->

    <div id="difficultyScreen" class="difficulty-screen hidden">

      <p class="subtitle">
        Scegli la difficoltà 🧩
      </p>

      <img
        id="selectedImage"
        class="selected-preview"
        src=""
        alt="Immagine scelta"
      >

      <div class="difficulty-buttons">

        <button class="difficulty-button easy" onclick="startPuzzle('easy')">
          🟢 Easy
          <span class="difficulty-pieces">9 pezzi · 3 × 3</span>
        </button>

        <button class="difficulty-button medium" onclick="startPuzzle('medium')">
          🟡 Medium
          <span class="difficulty-pieces">16 pezzi · 4 × 4</span>
        </button>

        <button class="difficulty-button hard" onclick="startPuzzle('hard')">
          🔴 Hard
          <span class="difficulty-pieces">36 pezzi · 6 × 6</span>
        </button>

      </div>

      <button class="back-button" onclick="backToImages()">
        ← Cambia immagine
      </button>
    </div>

    <!-- GIOCO PUZZLE -->

    <div id="puzzleGame" class="puzzle-game hidden">

      <p class="subtitle">
        Ricomponi l'immagine! 🧩
      </p>

      <div id="puzzleBoard" class="puzzle-board"></div>

      <div id="puzzleMessage" class="puzzle-message"></div>

      <button class="back-button" onclick="backToDifficulty()">
        ← Cambia difficoltà
      </button>

    </div>

        <button class="back-button" onclick="window.location.href='index.html'">
      ← Torna a Bunzy
    </button>

  </main>

  <script>
    let selectedImage = "";

    function selectImage(image) {
      selectedImage = image;

      document.getElementById("selectedImage").src = image;

      document.getElementById("imageScreen").classList.add("hidden");
      document.getElementById("difficultyScreen").classList.remove("hidden");
    }

    function backToImages() {
      document.getElementById("difficultyScreen").classList.add("hidden");
      document.getElementById("imageScreen").classList.remove("hidden");
    }

    let currentDifficulty = "easy";
let draggedPiece = null;
let dragOffsetX = 0;
let dragOffsetY = 0;

function startPuzzle(difficulty) {
  currentDifficulty = difficulty;

  document.getElementById("difficultyScreen").classList.add("hidden");
  document.getElementById("puzzleGame").classList.remove("hidden");

  createPuzzle();
}

function createPuzzle() {
  const board = document.getElementById("puzzleBoard");

  board.innerHTML = "";
  document.getElementById("puzzleMessage").textContent = "";

  let rows;
  let cols;

  if (currentDifficulty === "easy") {
    rows = 3;
    cols = 3;
  } else if (currentDifficulty === "medium") {
    rows = 4;
    cols = 4;
  } else {
    rows = 6;
    cols = 6;
  }

  const boardWidth = board.clientWidth;
  const pieceWidth = boardWidth / cols;
  const pieceHeight = board.clientHeight / rows;

  const pieces = [];

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      pieces.push({ row, col });
    }
  }

  pieces.sort(() => Math.random() - 0.5);

  pieces.forEach((piece, index) => {

    const svg = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "svg"
    );

    svg.classList.add("puzzle-piece");

    svg.style.width = pieceWidth + "px";
    svg.style.height = pieceHeight + "px";

    const randomX =
      Math.random() * Math.max(10, boardWidth - pieceWidth);

    const randomY =
      Math.random() * Math.max(10, board.clientHeight - pieceHeight);

    svg.style.left = randomX + "px";
    svg.style.top = randomY + "px";
    svg.style.zIndex = index + 1;

    svg.dataset.row = piece.row;
    svg.dataset.col = piece.col;

    const clipId = "clip-" + index + "-" + Date.now();

    svg.setAttribute(
      "viewBox",
      "0 0 100 100"
    );

    svg.innerHTML = `
      <defs>
        <clipPath id="${clipId}">
          <path d="
            M 0 0
            H 35
            C 35 12, 65 12, 65 0
            H 100
            V 35
            C 88 35, 88 65, 100 65
            V 100
            H 65
            C 65 88, 35 88, 35 100
            H 0
            V 65
            C 12 65, 12 35, 0 35
            Z
          "/>
        </clipPath>
      </defs>

      <image
        href="${selectedImage}"
        width="${cols * 100}"
        height="${rows * 100}"
        x="${-piece.col * 100}"
        y="${-piece.row * 100}"
        preserveAspectRatio="none"
        clip-path="url(#${clipId})"
      />

      <path
        d="
          M 0 0
          H 35
          C 35 12, 65 12, 65 0
          H 100
          V 35
          C 88 35, 88 65, 100 65
          V 100
          H 65
          C 65 88, 35 88, 35 100
          H 0
          V 65
          C 12 65, 12 35, 0 35
          Z
        "
        fill="none"
        stroke="rgba(255,255,255,0.8)"
        stroke-width="2"
      />
    `;

    svg.addEventListener("pointerdown", startDrag);

    board.appendChild(svg);
  });
}

function startDrag(event) {
  event.preventDefault();

  draggedPiece = event.currentTarget;

  const pieceRect = draggedPiece.getBoundingClientRect();

  dragOffsetX = event.clientX - pieceRect.left;
  dragOffsetY = event.clientY - pieceRect.top;

  draggedPiece.style.zIndex = "1000";

  draggedPiece.setPointerCapture(event.pointerId);

  draggedPiece.addEventListener("pointermove", dragPiece);
  draggedPiece.addEventListener("pointerup", stopDrag);
  draggedPiece.addEventListener("pointercancel", stopDrag);
}

function dragPiece(event) {
  if (!draggedPiece) return;

  event.preventDefault();

  const board = document.getElementById("puzzleBoard");
  const boardRect = board.getBoundingClientRect();

  const newX =
    event.clientX -
    boardRect.left -
    dragOffsetX;

  const newY =
    event.clientY -
    boardRect.top -
    dragOffsetY;

  draggedPiece.style.left = newX + "px";
  draggedPiece.style.top = newY + "px";
}

function stopDrag(event) {
  if (!draggedPiece) return;

  const piece = draggedPiece;

  piece.removeEventListener("pointermove", dragPiece);
  piece.removeEventListener("pointerup", stopDrag);
  piece.removeEventListener("pointercancel", stopDrag);

  if (piece.hasPointerCapture(event.pointerId)) {
    piece.releasePointerCapture(event.pointerId);
  }

  const board = document.getElementById("puzzleBoard");

  let rows;
  let cols;

  if (currentDifficulty === "easy") {
    rows = 3;
    cols = 3;
  } else if (currentDifficulty === "medium") {
    rows = 4;
    cols = 4;
  } else {
    rows = 6;
    cols = 6;
  }

  const row = Number(piece.dataset.row);
  const col = Number(piece.dataset.col);

  const pieceWidth = board.clientWidth / cols;
  const pieceHeight = board.clientHeight / rows;

  const correctX = col * pieceWidth;
  const correctY = row * pieceHeight;

  const currentX = parseFloat(piece.style.left);
  const currentY = parseFloat(piece.style.top);

  const distance = Math.hypot(
    currentX - correctX,
    currentY - correctY
  );

  if (distance < 80) {
    piece.style.left = correctX + "px";
    piece.style.top = correctY + "px";

    piece.style.zIndex = "500";

    piece.dataset.locked = "true";
    piece.style.cursor = "default";
    piece.style.pointerEvents = "none";
  }

  draggedPiece = null;

  checkPuzzle();
}
    
function checkPuzzle() {
  const pieces =
    document.querySelectorAll(".puzzle-piece");

  let complete = true;

  pieces.forEach((piece) => {
    if (piece.dataset.locked !== "true") {
      complete = false;
    }
  });

  if (complete && pieces.length > 0) {
    document.getElementById("puzzleMessage").textContent =
      "Hai completato il puzzle! 🎉🧩💗";
  }
}

function backToDifficulty() {
  document.getElementById("puzzleGame").classList.add("hidden");
  document.getElementById("difficultyScreen").classList.remove("hidden");

  document.getElementById("puzzleMessage").textContent = "";
}
  </script>

</body>
</html>
