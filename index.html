<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bunzy 🎮</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f8dfe8;
      color: #4d3b42;
      text-align: center;
    }

    header {
      padding: 55px 20px 35px;
    }

    h1 {
      font-size: clamp(3.5rem, 10vw, 6rem);
      margin: 0;
    }

    .subtitle {
      font-size: 1.3rem;
      margin-top: 10px;
    }

    .games {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .game {
      background: #f0f5c9;
      border-radius: 25px;
      padding: 35px 20px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1.3rem;
    }

    .game:hover {
      transform: scale(1.04);
    }

    .game-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .coming-soon {
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎀 BUNZY 🎮</h1>
    <p class="subtitle">Ti annoi? Gioca con noi!</p>
  </header>

  <main class="games">

    <div class="game">
      <div class="game-icon">🎲</div>
      <strong>Gioco misterioso</strong>
      <p>In arrivo...</p>
    </div>

    <div class="game coming-soon">
      <div class="game-icon">🧩</div>
      <strong>Nuovo gioco</strong>
      <p>Coming soon!</p>
    </div>

    <div class="game coming-soon">
      <div class="game-icon">🎨</div>
      <strong>Nuovo gioco</strong>
      <p>Coming soon!</p>
    </div>

    <div class="game coming-soon">
      <div class="game-icon">✨</div>
      <strong>Nuovo gioco</strong>
      <p>Coming soon!</p>
    </div>

  </main>

</body>
</html>
