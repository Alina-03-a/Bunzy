<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunzy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #f9e1e8;
      color: #59653d;
      text-align: center;
    }

 /* DECORAZIONI NEGLI ANGOLI */

.vine {
  position: fixed;
  width: 190px;
  height: 190px;
  z-index: 0;
  pointer-events: none;
  opacity: 0.8;
}

/* Il rametto principale */
.vine::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border: 2px solid #8fa36d;
  border-left: none;
  border-bottom: none;
  border-radius: 0 100% 0 0;
}

/* Le foglioline */
.vine::after {
  content: "❦  ❦  ❦";
  position: absolute;
  color: #a8bd7d;
  font-size: 27px;
  letter-spacing: 14px;
  transform: rotate(-28deg);
  top: 35px;
  left: 25px;
}

.top-left {
  top: -15px;
  left: -15px;
  transform: rotate(-90deg);
}

.top-right {
  top: -15px;
  right: -15px;
}

.bottom-left {
  bottom: -15px;
  left: -15px;
  transform: rotate(180deg);
}

.bottom-right {
  bottom: -15px;
  right: -15px;
  transform: rotate(90deg);
}
    /* PICCOLI FIORI */

    .flower {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      color: #f1a8bc;
      font-size: 28px;
    }

    .flower::before {
      content: "✿";
    }

    .flower.one {
      top: 24%;
      left: 6%;
    }

    .flower.two {
      bottom: 20%;
      right: 7%;
      font-size: 22px;
    }
    
    .flower.three {
      top: 16%;
      right: 7%;
      font-size: 20px;
    }

    .flower.four {
      bottom: 12%;
      left: 7%;
      font-size: 24px;
   }

    .flower.five {
      top: 43%;
      left: 3%;
      font-size: 18px;
   }

    .flower.six {
      top: 58%;
      right: 4%;
      font-size: 21px;
   }

    .flower.seven {
      top: 8%;
      left: 22%;
      font-size: 17px;
   }

    .flower.eight {
      bottom: 8%;
      right: 22%;
      font-size: 19px;
   }

    .flower.nine {
      top: 34%;
      right: 2%;
      font-size: 16px;
   }

    .flower.ten {
      bottom: 32%;
      left: 4%;
      font-size: 20px;
   }

    .flower.eleven {
      top: 72%;
      left: 10%;
      font-size: 17px;
   }

    .flower.twelve {
      top: 78%;
      right: 9%;
     font-size: 22px;
   }

    /* CONTENUTO */

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 55px 20px 35px;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 11vw, 7rem);
      font-weight: 900;
      letter-spacing: 4px;
      color: #ef9db5;
      text-shadow:
        3px 3px 0 #fff7f8,
        6px 6px 0 #aebf86;
    }

    .subtitle {
      display: inline-block;
      margin: 20px 0 25px;
      padding: 12px 28px;
      background: rgba(255,255,255,0.55);
      border: 2px solid #f0b5c5;
      border-radius: 50px;
      color: #89616d;
      font-size: clamp(1rem, 3vw, 1.25rem);
    }

    .choose {
      margin: 10px 0 28px;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      color: #687547;
    }

    .games {
      width: min(100%, 1050px);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .game {
      min-height: 245px;
      padding: 28px 15px;
      background: #f1f5d7;
      border: 2px solid #b7c78c;
      border-radius: 28px;
      box-shadow: 0 8px 0 rgba(183, 199, 140, 0.35);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .game:hover {
      transform: translateY(-7px);
    }

    .game-icon {
      font-size: 3.8rem;
      margin: 12px 0 18px;
    }

    .game h2 {
      margin: 0 0 12px;
      font-size: 1.3rem;
      color: #59653d;
    }

    .game p {
      margin: 0;
      color: #d7829a;
      font-size: 1rem;
    }

    footer {
      margin-top: 35px;
      color: #9b717d;
    }

    /* IPAD */

    @media (max-width: 900px) {
      .games {
        grid-template-columns: repeat(2, 1fr);
        max-width: 600px;
      }
    }

    /* TELEFONO */

    @media (max-width: 520px) {
      .page {
        padding: 45px 15px 25px;
      }

      .games {
        grid-template-columns: 1fr;
        max-width: 330px;
      }

      .game {
        min-height: 210px;
      }

      .vine {
        transform: scale(0.7);
      }

      .top-left {
        transform: rotate(-90deg) scale(0.7);
      }

      .bottom-left {
        transform: rotate(180deg) scale(0.7);
      }

      .bottom-right {
        transform: rotate(90deg) scale(0.7);
      }
    }
  </style>
</head>

<body>

  <div class="vine top-left"></div>
  <div class="vine top-right"></div>
  <div class="vine bottom-left"></div>
  <div class="vine bottom-right"></div>

  <div class="flower one"></div>
  <div class="flower two"></div>
  <div class="flower three"></div>
  <div class="flower four"></div>
  <div class="flower five"></div>
  <div class="flower six"></div>
  <div class="flower seven"></div>
  <div class="flower eight"></div>
  <div class="flower nine"></div>
  <div class="flower ten"></div>
  <div class="flower eleven"></div>
  <div class="flower twelve"></div>

  <div class="page">

    <h1>BUNZY</h1>

    <div class="subtitle">
      ♡ Ti annoi? Gioca con noi! ♡
    </div>

    <div class="choose">
      Scegli un gioco!
    </div>

    <main class="games">

      <div class="game">
        <div class="game-icon">🎲</div>
        <h2>Gioco misterioso</h2>
        <p>In arrivo...</p>
      </div>

      <div class="game">
        <div class="game-icon">🧩</div>
        <h2>Nuovo gioco</h2>
        <p>Coming soon!</p>
      </div>

      <div class="game">
        <div class="game-icon">🎨</div>
        <h2>Nuovo gioco</h2>
        <p>Coming soon!</p>
      </div>

      <div class="game">
        <div class="game-icon">✨</div>
        <h2>Nuovo gioco</h2>
        <p>Coming soon!</p>
      </div>

    </main>

    <footer>♡ Bunzy ♡</footer>

  </div>

</body>
</html>
